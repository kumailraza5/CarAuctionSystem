kind = "web"
previewPath = "/"
title = "Vehicle Sale & Auction Platform"
version = "1.0.0"
id = "artifacts/vehicle-platform"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22411

[services.development]
run = "pnpm --filter @workspace/vehicle-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vehicle-platform", "run", "build" ]
publicDir = "artifacts/vehicle-platform/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22411"
BASE_PATH = "/"
